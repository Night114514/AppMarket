name: Android Debug CI

on:
  workflow_dispatch:

  push:
    branches:
      - build-test
    paths-ignore:
      - "README.md"
      - "doc/**"

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon :app:android:assembleDebug

      - name: Locate APK
        run: |
          APK_FILE="$(find app/android/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "Debug APK not found."
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "Found APK: $APK_FILE"
          ls -lh "$APK_FILE"

      - name: Display APK Hashes
        run: |
          echo "### AppMarket Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Hash | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA-256 | \`$(sha256sum "$APK_FILE" | awk '{print $1}')\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA-1 | \`$(sha1sum "$APK_FILE" | awk '{print $1}')\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MD5 | \`$(md5sum "$APK_FILE" | awk '{print $1}')\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: AppMarket-debug-${{ github.run_number }}
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 14
