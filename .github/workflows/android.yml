name: Android Release CI

on:
  workflow_dispatch:

  push:
    branches:
      - build-test
    paths-ignore:
      - "README.md"
      - "doc/**"

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-24.04

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
      KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Signing Secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail

          for name in SIGNING_KEY KEYSTORE_PASS KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required signing secret/variable $name is empty."
              exit 1
            fi
          done

      - name: Decode Signing Key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077

          printf '%s' "$SIGNING_KEY" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

      - name: Verify Keystore
        run: |
          set -euo pipefail

          keytool -list             -keystore "$KEYSTORE_PATH"             -storepass "$KEYSTORE_PASS"             -alias "$KEY_ALIAS" > /dev/null

          keytool -exportcert             -keystore "$KEYSTORE_PATH"             -storepass "$KEYSTORE_PASS"             -alias "$KEY_ALIAS"             -file signer-cert.der > /dev/null

          KEYSTORE_CERT_SHA256="$(sha256sum signer-cert.der | awk '{print $1}')"
          echo "KEYSTORE_CERT_SHA256=$KEYSTORE_CERT_SHA256" >> "$GITHUB_ENV"

          echo "### Signing certificate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source | SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Keystore certificate | `$KEYSTORE_CERT_SHA256` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Build Release APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:android:assembleRelease

      - name: Locate Release APK
        run: |
          set -euo pipefail

          APK_FILE="$(find app/android/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "::error::Release APK not found."
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "Found APK: $APK_FILE"
          ls -lh "$APK_FILE"

      - name: Verify APK Signature
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under ANDROID_HOME."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK_FILE"

          APK_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK_FILE" |
            awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')"

          if [ -z "$APK_CERT_SHA256" ]; then
            echo "::error::Could not read APK signing certificate SHA-256."
            exit 1
          fi

          if [ "${APK_CERT_SHA256,,}" != "${KEYSTORE_CERT_SHA256,,}" ]; then
            echo "::error::APK signer does not match the configured release keystore."
            echo "Keystore certificate SHA-256: $KEYSTORE_CERT_SHA256"
            echo "APK certificate SHA-256:      $APK_CERT_SHA256"
            exit 1
          fi

          echo "| APK signer certificate | `$APK_CERT_SHA256` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Signature verification: **passed**" >> "$GITHUB_STEP_SUMMARY"

      - name: Display APK Hashes
        run: |
          set -euo pipefail

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Hash | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA-256 | `$(sha256sum "$APK_FILE" | awk '{print $1}')` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA-1 | `$(sha1sum "$APK_FILE" | awk '{print $1}')` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MD5 | `$(md5sum "$APK_FILE" | awk '{print $1}')` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | `$(basename "$APK_FILE")` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | `$(stat -c '%s bytes' "$APK_FILE")` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: AppMarket-release-${{ github.run_number }}
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Clean Signing Material
        if: always()
        run: |
          rm -f "$KEYSTORE_PATH" signer-cert.der
